<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amelie Dominó">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" content="#05071a">
<title>Amelie Neon Dominó — O Reino dos Poderes</title>
<style>:root{
  --bg0:#05071a;--bg1:#0a1030;--glass:rgba(16,24,64,.62);--glass2:rgba(30,40,100,.5);
  --cy:#27e6ff;--bl:#3a7bff;--pu:#a24bff;--pk:#ff4fb8;--gd:#ffcf5a;--tx:#eaf2ff;--mu:#9fb0d8;--ok:#52ffa8;--bad:#ff6b7d;
  --tw:46px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 90% at 20% 0%,#16226a 0%,#070b26 55%,#03040f 100%)}
body.hc{--tx:#fff;--mu:#dbe5ff;--glass:rgba(0,0,20,.92)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px 16px;overflow-y:auto}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid rgba(39,230,255,.55);background:linear-gradient(180deg,rgba(58,123,255,.35),rgba(162,75,255,.28));
  padding:14px 18px;border-radius:16px;font-weight:700;font-size:1.05rem;min-height:52px;
  box-shadow:0 0 18px rgba(39,230,255,.25),inset 0 0 12px rgba(255,255,255,.06);transition:transform .12s,box-shadow .2s}
.btn:hover{box-shadow:0 0 28px rgba(39,230,255,.5);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.tile-btn:focus-visible,.endbtn:focus-visible,.pw:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.btn.big{font-size:1.25rem;min-height:64px}
.btn.gold{border-color:var(--gd);background:linear-gradient(180deg,rgba(255,207,90,.35),rgba(162,75,255,.3));box-shadow:0 0 22px rgba(255,207,90,.3)}
.btn.pink{border-color:var(--pk)}
.btn.ghost{background:var(--glass);border-color:rgba(159,176,216,.4);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
.btn.sm{min-height:44px;padding:8px 14px;font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.card{background:var(--glass);border:1px solid rgba(120,150,255,.28);border-radius:18px;padding:14px;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 0 20px rgba(80,120,255,.06)}
h1,h2,h3{margin:.2em 0}
h2{font-size:1.5rem;text-shadow:0 0 14px rgba(39,230,255,.6)}
.mu{color:var(--mu)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topbar h2{flex:1;margin:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--pu),var(--pk));border-radius:99px;transition:width .6s}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:.9rem}

/* ----- Logo / início ----- */
.home{align-items:center;justify-content:center;text-align:center;gap:14px}
.logo{margin:6px 0 0}
.logo .a{display:block;font-size:clamp(3rem,13vw,6.2rem);font-weight:900;letter-spacing:.08em;line-height:1;
  background:linear-gradient(90deg,var(--cy),#6f8bff 30%,var(--pk) 65%,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(120,90,255,.9)) drop-shadow(0 0 30px rgba(39,230,255,.5));animation:glow 3.2s ease-in-out infinite}
.logo .b{display:block;font-size:clamp(1.1rem,4.4vw,1.9rem);letter-spacing:.5em;color:var(--gd);text-shadow:0 0 14px rgba(255,207,90,.8);margin-top:6px;font-weight:700}
.slogan{color:var(--mu);max-width:560px;margin:0 auto}
@keyframes glow{50%{filter:drop-shadow(0 0 22px rgba(255,79,184,.9)) drop-shadow(0 0 40px rgba(39,230,255,.7))}}
.menu{display:flex;flex-direction:column;gap:12px;width:min(420px,100%)}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(520px,100%)}
.mini .btn{padding:8px 2px;font-size:.8rem;min-height:62px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center}
.mini .btn svg{width:22px;height:22px}
.hero-dom{display:flex;gap:12px;justify-content:center;margin:2px 0}

/* ----- Peças ----- */
.tile{display:block;filter:drop-shadow(0 0 5px rgba(39,230,255,.55)) drop-shadow(0 3px 3px rgba(0,0,0,.55));overflow:visible}
.tile-btn{background:none;border:0;padding:3px;border-radius:10px;position:relative;touch-action:manipulation}
.tile-btn.playable .tile{filter:drop-shadow(0 0 9px var(--ok)) drop-shadow(0 3px 3px rgba(0,0,0,.55))}
.tile-btn.playable{transform:translateY(-6px)}
.tile-btn.playable::after{content:"✓";position:absolute;top:-2px;right:-2px;background:var(--ok);color:#012;font-weight:900;width:20px;height:20px;border-radius:50%;font-size:13px;display:grid;place-items:center;box-shadow:0 0 8px var(--ok)}
.tile-btn.dim .tile{opacity:.72;filter:saturate(.6) brightness(.82) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.tile-btn.sel{transform:translateY(-16px) scale(1.06)}
.tile-btn.sel .tile{filter:drop-shadow(0 0 12px var(--pk)) drop-shadow(0 0 22px var(--gd))}
.tile-btn.hint .tile{animation:pulse 1s infinite}
.tile-btn.pick .tile{filter:drop-shadow(0 0 12px var(--gd))}
@keyframes pulse{50%{filter:drop-shadow(0 0 16px var(--gd))}}
.tile-btn.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ----- Jogo ----- */
.game{padding:8px 10px 10px;gap:8px}
.game>*{flex-shrink:0}.game .table{flex-shrink:0}
.hud{display:flex;align-items:center;gap:8px}
.hud .title{flex:1;font-weight:700;color:var(--cy);text-shadow:0 0 10px rgba(39,230,255,.6);font-size:.95rem}
.opp{display:flex;align-items:center;gap:10px;padding:8px 10px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:radial-gradient(circle,rgba(162,75,255,.5),rgba(10,16,48,.8));border:2px solid var(--pu);box-shadow:0 0 14px var(--pu)}
.backs{display:flex;gap:3px;flex-wrap:wrap}
.bubble{margin-left:auto;background:rgba(255,255,255,.1);padding:6px 12px;border-radius:14px 14px 14px 4px;font-size:.9rem;max-width:45%}
.think{display:inline-flex;gap:3px}.think i{width:6px;height:6px;border-radius:50%;background:var(--cy);animation:bl 1s infinite}.think i:nth-child(2){animation-delay:.2s}.think i:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2;transform:translateY(-3px)}}
.table{position:relative;flex:1 0 auto;min-height:250px;border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  background:radial-gradient(90% 100% at 50% 0%,rgba(39,230,255,.18),rgba(20,30,90,.55) 55%,rgba(6,10,36,.85));border:2px solid rgba(39,230,255,.6);
  box-shadow:0 0 30px rgba(39,230,255,.35),inset 0 0 40px rgba(58,123,255,.25)}
body.t-aurora .table{background:radial-gradient(90% 100% at 50% 0%,rgba(255,79,184,.22),rgba(70,30,130,.6) 55%,rgba(14,6,36,.9));border-color:var(--pk);box-shadow:0 0 30px rgba(255,79,184,.4),inset 0 0 40px rgba(162,75,255,.3)}
body.t-vip .table{background:radial-gradient(90% 100% at 50% 0%,rgba(255,207,90,.25),rgba(80,40,120,.6) 55%,rgba(14,6,30,.9));border-color:var(--gd);box-shadow:0 0 30px rgba(255,207,90,.4),inset 0 0 40px rgba(162,75,255,.3)}
.ends{display:flex;gap:8px;align-items:stretch}
.endbtn{flex:1;min-height:54px;border-radius:14px;border:2px dashed rgba(159,176,216,.35);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--mu)}
.endbtn.on{border:2px solid var(--gd);color:#fff;background:rgba(255,207,90,.16);animation:glowb 1s infinite;cursor:pointer}
.endbtn.on::before{content:"▶ ";color:var(--gd)}
.endbtn.drop{background:rgba(39,230,255,.25)}
@keyframes glowb{50%{box-shadow:0 0 22px var(--gd)}}
.board{flex:1;overflow-y:auto;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center;padding:6px;min-height:80px;align-items:center}
.board .tile{filter:drop-shadow(0 0 4px rgba(39,230,255,.5)) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.board .last .tile{filter:drop-shadow(0 0 10px var(--gd))}
.board .wildt .tile{filter:drop-shadow(0 0 10px var(--pk))}
.board .ent{animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-26px) scale(1.2);opacity:0}}
.empty{color:var(--mu);text-align:center;width:100%}
.coach{background:rgba(255,207,90,.14);border:1px solid var(--gd);border-radius:12px;padding:8px 12px;font-size:.95rem}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.energy{display:flex;gap:3px;align-items:center}
.energy i{width:10px;height:16px;border-radius:3px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2)}
.energy i.f{background:linear-gradient(180deg,var(--cy),var(--bl));box-shadow:0 0 8px var(--cy)}
.powers{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px}
.pw{flex:0 0 auto;width:78px;border-radius:14px;border:1px solid rgba(162,75,255,.6);background:rgba(60,30,120,.55);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;text-align:center;line-height:1.1}
.pw svg{width:30px;height:30px}
.pw b{color:var(--gd)}
.pw[disabled]{opacity:.4}
.pw.on{border-color:var(--gd);box-shadow:0 0 14px var(--gd)}
.hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:18px 0 8px;min-height:calc(var(--tw)*2 + 28px);position:sticky;bottom:-10px;background:linear-gradient(180deg,rgba(5,7,26,0),rgba(5,7,26,.92) 28%);z-index:3}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.bolt path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--cy)) drop-shadow(0 0 12px var(--pu));stroke-dasharray:1200;stroke-dashoffset:1200;animation:zap .55s forwards}
@keyframes zap{to{stroke-dashoffset:0;opacity:0}}
.portal{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:4px solid var(--pk);box-shadow:0 0 30px var(--pu),inset 0 0 30px var(--cy);animation:port 1.2s ease-out forwards}
@keyframes port{40%{transform:scale(9) rotate(180deg);opacity:1}100%{transform:scale(12) rotate(360deg);opacity:0}}
.star{position:absolute;color:var(--gd);animation:fall 1s ease-in forwards;text-shadow:0 0 8px var(--gd)}
@keyframes fall{to{transform:translateY(120px);opacity:0}}
.flash{position:absolute;inset:0;border-radius:22px;animation:fl .6s forwards;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
@keyframes fl{to{opacity:0}}

/* ----- Modais ----- */
.modal-bg{position:fixed;inset:0;z-index:20;background:rgba(2,4,18,.78);display:grid;place-items:center;padding:14px}
.modal{width:min(520px,100%);max-height:92dvh;overflow:auto;background:linear-gradient(180deg,#121a4d,#0a0f32);border:2px solid var(--cy);border-radius:22px;padding:18px;box-shadow:0 0 40px rgba(39,230,255,.4);animation:pop .3s}
.modal.gold{border-color:var(--gd);box-shadow:0 0 40px rgba(255,207,90,.5)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:30;background:rgba(10,16,50,.95);border:1px solid var(--gd);padding:10px 16px;border-radius:14px;max-width:90vw;text-align:center;animation:pop .2s}
canvas.conf{position:fixed;inset:0;z-index:25;pointer-events:none;width:100%;height:100%}
.chest{width:150px;height:130px;margin:6px auto;display:block;filter:drop-shadow(0 0 16px var(--cy))}
.chest .lid{transform-origin:20px 52px;animation:lid 1s .2s forwards}
@keyframes lid{to{transform:rotate(-55deg)}}
.chest .beam{opacity:0;animation:beam 1s .5s forwards}
@keyframes beam{to{opacity:.9}}

/* ----- Itens ----- */
.item{display:flex;gap:10px;align-items:center}
.item.locked{opacity:.6}
.item .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);flex:none}
.item .ic.skin{width:80px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.tab{padding:8px 14px;border-radius:99px;border:1px solid rgba(159,176,216,.4);background:var(--glass);white-space:nowrap;min-height:40px}
.tab.on{border-color:var(--cy);background:rgba(39,230,255,.2)}
.vipdoor{margin:10px auto;width:min(280px,80%);aspect-ratio:3/4;border-radius:120px 120px 14px 14px;border:3px solid var(--gd);display:grid;place-items:center;text-align:center;padding:16px;
  background:repeating-linear-gradient(0deg,rgba(255,207,90,.08) 0 2px,transparent 2px 6px),radial-gradient(circle,rgba(162,75,255,.5),rgba(10,10,40,.9));box-shadow:0 0 40px rgba(255,207,90,.5),inset 0 0 40px rgba(162,75,255,.5);animation:glow 3s infinite}
.vip-room{background:linear-gradient(180deg,rgba(255,207,90,.08),rgba(162,75,255,.12));border-radius:20px;padding:8px}
.npc{display:flex;gap:10px;align-items:flex-start}
.npc .avatar{border-color:var(--gd);box-shadow:0 0 14px var(--gd)}
.slot{display:inline-flex;align-items:center;justify-content:center;border:3px dashed var(--gd);border-radius:12px;color:var(--gd);font-weight:900;font-size:2rem;animation:glowb 1.2s infinite}
.puz{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
.seq{display:flex;gap:6px;flex-wrap:wrap;min-height:48px;padding:8px;border-radius:12px;border:1px dashed var(--cy);justify-content:center}
.wiz{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.sw{display:flex;align-items:center;gap:12px;padding:10px 0;min-height:52px}
input[type=range]{width:140px}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--cy)}
body.rm *{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}
body.rm #stars{display:none}
@media (max-height:640px){.logo .a{font-size:3.2rem}.hero-dom{display:none}}
@media (min-width:760px){:root{--tw:58px}.hand{gap:10px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* ================= MOBILE-FIRST (partida em tela fixa) ================= */
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
input[type=range]{touch-action:pan-x}
.scr{padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.scr.game{height:100dvh;overflow:hidden;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:6px}
.game>*{flex-shrink:0}
.game .hud{gap:6px;min-height:46px}
.btn.ico{min-height:44px;min-width:44px;padding:4px 10px;font-size:1.15rem}
.hud .opp{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0}
.avatar.sm{width:34px;height:34px;font-size:19px;flex:none}
.opp .oi{display:flex;flex-direction:row;align-items:center;gap:6px;line-height:1.1;min-width:0;font-size:.9rem;flex-wrap:nowrap}
.opp .backs{display:flex;gap:2px;flex-wrap:nowrap;overflow:hidden;min-width:0}
.opp .bubble{margin-left:auto;min-width:0;max-width:44%;font-size:.78rem;padding:4px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.1);border-radius:12px 12px 12px 3px}
.hud .chip.turn{flex:none;font-size:.82rem;padding:5px 9px}
.game .table{flex:1 1 0;min-height:110px;padding:8px;gap:6px}
.table .ttl{position:absolute;top:4px;left:50%;transform:translateX(-50%);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);opacity:.75;pointer-events:none;z-index:1}
.table .ends{margin-top:4px}
.endbtn{min-height:50px;font-size:.88rem}
.endbtn span{white-space:nowrap}
.board{flex:1 1 0;min-height:0;padding:4px;gap:4px}
.board>div{flex:none;display:flex}
.board .tile{height:auto}
.game .coach{font-size:.85rem;padding:6px 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.game.tutg .coach{display:block;font-size:.95rem}
.ctl{display:flex;flex-direction:column;gap:5px}
.pwrap{display:flex;flex-direction:column;gap:3px}
.status{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;font-size:.8rem;overflow:hidden}
.status .chip{padding:2px 8px;font-size:.75rem;white-space:nowrap}
.status .chip.rv{margin-left:auto}
.status .q{min-height:32px;min-width:32px;padding:0 8px;border-radius:99px}
.energy i{width:8px;height:14px}
.powers{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 4px;scrollbar-width:none}
.powers::-webkit-scrollbar{display:none}
.pw{flex:1 0 54px;width:auto;min-width:54px;min-height:54px;padding:4px 2px;font-size:.66rem}
.pw svg{width:26px;height:26px}
.pw .pn{display:none}
@media (min-width:480px){.pw .pn{display:block}.pw{flex-basis:70px}}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap}
.acts .btn{min-height:48px;padding:8px 12px;font-size:.98rem;flex:1 1 0;max-width:210px;white-space:nowrap}
.acts .btn.ghost,.acts .btn.sm{flex:0 0 auto;min-width:48px}
.acts small{opacity:.8}
.game .hand{position:static;flex:none;flex-wrap:wrap;gap:5px;padding:16px 0 0;min-height:0;background:none;bottom:auto}
.tile-btn{padding:2px}
.toast{top:max(6px,env(safe-area-inset-top));bottom:auto;font-size:.92rem;box-shadow:0 6px 24px rgba(0,0,0,.6)}
.modal{max-height:calc(100dvh - 24px)}
.home .menu .btn{min-height:58px}

/* Paisagem em celular: tudo numa faixa só, mesa larga */
@media (orientation:landscape) and (max-height:520px){
  .scr.game{gap:4px}
  .game .hud{min-height:40px}
  .game .coach{display:none}.game.tutg .coach{display:block;font-size:.8rem;padding:4px 8px}
  .table .ttl{display:none}
  .table .ends{margin-top:0}
  .endbtn{min-height:42px}
  .ctl{flex-direction:row;align-items:center;gap:8px}
  .ctl .pwrap{flex:1;min-width:0}
  .ctl .acts{flex:none}
  .acts .btn{min-height:44px;padding:6px 10px}
  .pw{min-height:44px;flex-basis:46px}.pw svg{width:22px;height:22px}.pw .pn{display:none!important}.status .chip.rv{display:none}
  .status{font-size:.72rem}.energy i{height:10px}
  .game .hand{padding-top:12px}
  .home .hero-dom,.home .slogan{display:none}
  .logo .a{font-size:3rem}
  .scr.home{gap:8px}
}
@media (max-height:700px) and (orientation:portrait){
  .game .hud{min-height:42px}
  .acts .btn{min-height:44px}
  .pw{min-height:48px}
}

/* ---- Botão de som ---- */
.snd{flex:none;min-width:44px;min-height:44px;font-size:1.25rem;padding:0 10px}
.snd.lg{min-width:52px;min-height:52px;font-size:1.5rem}
.home-snd{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:2px}
.snd-hint{animation:sndp 1.6s ease-in-out infinite;font-size:.8rem}
@keyframes sndp{50%{box-shadow:0 0 14px var(--cy)}}
body.rm .snd-hint{animation:none}
</style>

    again() { const g = G; if (!g) return go('home'); startGameFlow({ mode: g.st.mode, level: g.level, powers: g.st.powersOn, enemyEnergy: g.vip ? 5 : undefined, extra: { vip: g.vip, training: g.training, caseId: g.caseId } }); },
    startTraining() { closeModal(); startGameFlow({ mode: 'training', level: 'easy', powers: false, extra: { training: true } }); },
    startVip() { if (!C.isVipUnlocked(profile)) return toast('Desbloqueie o Clube VIP primeiro.'); closeModal(); startGameFlow({ mode: 'vip', level: 'hard', powers: true, enemyEnergy: 5, extra: { vip: true } }); },
    startTutorial, tutGo,
    pause() { showModal('<h2>⏸ Pausa</h2><p class="mu">Sem pressa! O jogo espera por você.</p><div style="display:grid;gap:8px"><button class="btn" data-act="closeModal">▶ Continuar</button><button class="btn ghost" data-act="restart">🔄 Reiniciar partida</button><button class="btn ghost" data-act="leave">🏠 Sair para o menu</button></div>'); },
    restart() { const g = G; closeModal(); if (g && g.tut) return tutGo(); H.again(); },
    leave() { G = null; go('home'); },
    tile(d) {
      if (!G) return; const g = G;
      if (g.pick === 'portal' && canAct()) { doAction({ type: 'power', player: 'p', power: 'portal', arg: d.id }); return; }
      if (!canAct()) { if (!g.finished && g.st.turn !== 'p') toast('Aguarde a vez do Volt.'); return; }
      const can = E.playableTileIds(g.st, 'p').includes(d.id);
      if (!can) { A.play('bad'); toast(g.st.forcedFirst && !g.st.board.length ? 'A primeira jogada precisa ser a peça indicada ✓.' : 'Essa peça não encaixa em nenhuma ponta.'); return; }
      g.sel = g.sel === d.id ? null : d.id; A.play('select'); buzz(8);
      if (g.sel && quick()) {
        const t = g.st.hands.p.find((x) => x.id === g.sel);
        const sides = Array.from(new Set(E.movesForTile(g.st, t, g.st.wildArmed).map((m) => m.side)));
        if (sides.length === 1 && (!g.st.wildArmed || g.st.board.length === 0)) { playSel(sides[0]); return; }
      }
      render();
    },
    end(d) {
      if (!G) return; const g = G;
      if (!canAct()) return;
      if (!g.sel) { toast('Primeiro toque numa peça com ✓.'); A.play('bad'); buzz([25, 40, 25]); return; }
      playSel(d.s);
    },
    draw() { if (canAct()) doAction({ type: 'draw', player: 'p' }); },
    pass() { if (canAct()) doAction({ type: 'pass', player: 'p' }); },
    flip() { G.flip = !G.flip; render(); },
    hint() {
      if (!canAct()) return; const mv = E.chooseMove(G.st, 'p', 'medium', Math.random);
      if (!mv) return toast(G.st.stock.length ? 'Sem jogadas: compre uma peça.' : 'Sem jogadas: passe a vez.');
      G.hintTile = mv.tileId; G.sel = mv.tileId; render(); toast('💡 Esta peça é uma boa jogada.');
    },
    undo() { if (G && G.training && G.undo.length && !G.busy) { G.st = G.undo.pop(); G.sel = null; G.hintTile = null; G.lastId = null; G.msg = 'Desfeito! Tente outra jogada.'; render(); } },
    power(d) {
      if (!canAct()) return toast('Poderes só na sua vez.');
      const id = d.id, st = G.st;
      const err = E.powerError(st, 'p', id, st.hands.p[0] && st.hands.p[0].id);
      if (err) { A.play('bad'); return toast(err); }
      const pw = st.cfg.powers[id];
      if (!profile.seenPowers.includes(id)) {
        showModal(`<div style="text-align:center">${pIcon(id).replace('<svg', '<svg width="64" height="64"')}<h2>${pw.name}</h2></div><p>${pw.rule}</p><p class="mu">Custo: <b>${pw.cost}⚡</b>${pw.cd ? ' · Recarga: ' + pw.cd + ' turnos' : ''}${pw.limit ? ' · 1 vez por partida' : ''}</p><div class="row"><button class="btn grow gold" data-act="powerGo" data-id="${id}">Usar agora</button><button class="btn ghost grow" data-act="closeModal">Cancelar</button></div>`);
        return;
      }
      H.powerGo({ id });
    },
    powerGo(d) {
      closeModal(); if (!canAct()) return;
      if (!profile.seenPowers.includes(d.id)) { profile.seenPowers.push(d.id); save(); }
      if (d.id === 'portal') { G.pick = 'portal'; G.sel = null; render(); toast('🌀 Toque na peça da sua mão que quer trocar.'); return; }
      doAction({ type: 'power', player: 'p', power: d.id });
    },
    cancelPick() { G.pick = null; render(); },
    powerRules() { showModal(`<h2>📖 Poderes</h2><div style="display:grid;gap:10px;margin:8px 0">${E.POWER_IDS.map((id) => { const p = G.st.cfg.powers[id]; return `<div class="item"><div class="ic">${pIcon(id).replace('<svg', '<svg width="32" height="32"')}</div><div><b>${p.name}</b> · ${p.cost}⚡${p.cd ? ' · recarga ' + p.cd : ''}${p.limit ? ' · 1x' : ''}<div class="mu">${p.rule}</div></div></div>`; }).join('')}</div><p class="mu">Você ganha +1⚡ a cada turno (máx. ${G.st.cfg.maxEnergy}). Só 1 poder por turno.</p><button class="btn" style="width:100%" data-act="closeModal">Entendi</button>`); },
    openCase(d) { D = { c: C.CASES.find((x) => x.id === d.id), hints: 0, seq: [], msg: '' }; go('case'); },
    hint3() { if (D.hints < 3) { D.hints++; A.play('select'); render(); } },
    answer(d) {
      const ok = C.checkCase(D.c, d.v);
      if (ok) caseSolved();
      else { A.play('bad'); D.msg = 'Quase! Olhe de novo as pontas da mesa. Que tal pedir uma pista? 😊'; render(); }
    },
    chainAdd(d) {
      const c = D.c; let cur = c.start; D.seq.forEach((id) => { const t = T(id); cur = t.a === cur ? t.b : t.a; });
      const t = T(d.v);
      if (t.a !== cur && t.b !== cur) { A.play('bad'); D.msg = 'Essa peça não encaixa com o ' + cur + '. Tente outra!'; render(); return; }
      D.seq.push(d.v); A.play('place'); D.msg = '';
      if (D.seq.length === c.tiles.length) { if (C.checkCase(c, D.seq)) { render(); caseSolved(); return; } D.msg = 'Quase! Falta ajustar a ordem. Tire a última peça e tente outra.'; }
      render();
    },
    chainUndo() { D.seq.pop(); D.msg = ''; render(); }, chainClear() { D.seq = []; D.msg = ''; render(); },
    closeAgency() { closeModal(); go('agency'); },
    startCaseMatch() { const c = D.c; startGameFlow({ mode: c.mode, level: c.level, powers: c.mode === 'chaos', extra: { caseId: c.id } }); },
    claim(d) { const r = C.claimQuest(profile, d.id); if (r.ok) { A.play('reward'); if (r.levelUp) A.play('level'); const f = C.syncRewards(profile); save(); toast('🎁 Missão resgatada: +' + r.q.reward.coins + ' moedas!'); render(); if (f.length) showRewards(f); } },
    tab(d) { tab = d.k; render(); },
    equip(d) { if (C.equip(profile, d.id)) { A.play('select'); save(); render(); } },
    resetAsk() { showModal('<h2>Apagar progresso?</h2><p>Moedas, recompensas e casos resolvidos serão apagados deste navegador.</p><div class="row"><button class="btn grow pink" data-act="reset">Apagar</button><button class="btn ghost grow" data-act="closeModal">Cancelar</button></div>'); },
    reset() { Object.assign(profile, C.defaultProfile()); save(); closeModal(); toast('Progresso apagado.'); go('home'); },
  };
  function playSel(side) {
    const g = G; const sel = g.sel; if (!sel) return;
    doAction({ type: 'play', player: 'p', tileId: sel, side, flip: g.flip });
  }

  document.addEventListener('click', (e) => {
    const wasOn = A.running(); A.unlock();
    const el = e.target.closest('[data-act]'); if (!el) return;
    if (wasOn && !['tile', 'end', 'draw', 'pass', 'power', 'powerGo', 'answer', 'chainAdd', 'claim', 'equip', 'hint3', 'toggleSound', 'testSounds'].includes(el.dataset.act) && el.matches('button')) A.play('ui');
    if (el.dataset.act === 'noop' && e.target !== el) return;
    if (el.getAttribute('aria-disabled') === 'true' && el.dataset.act === 'power') { H.power(el.dataset); return; }
    const f = H[el.dataset.act]; if (f && !el.disabled) f(el.dataset, el);
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset.set) { profile.settings[t.dataset.set] = t.checked; save(); applySettings(); A.unlock(); }
    if (t.dataset.range) { profile.settings[t.dataset.range] = parseFloat(t.value); save(); A.configure(profile.settings); }
  });
  // Arrastar e soltar (computador)
  document.addEventListener('dragstart', (e) => {
    const b = e.target.closest && e.target.closest('.tile-btn[data-id]'); if (!b || !canAct()) { e.preventDefault && e.preventDefault(); return; }
    const id = b.dataset.id; if (!E.playableTileIds(G.st, 'p').includes(id)) { e.preventDefault(); return; }
    G.sel = id; e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move';
    setTimeout(render, 0);
  });
  document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('[data-dz]'); if (z && z.classList.contains('on')) { e.preventDefault(); z.classList.add('drop'); } });
  document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('[data-dz]'); if (z) z.classList.remove('drop'); });
  document.addEventListener('drop', (e) => { const z = e.target.closest && e.target.closest('[data-dz]'); if (!z) return; e.preventDefault(); if (canAct() && G.sel) playSel(z.dataset.dz); });
  let rsz = null;
  addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (screen === 'game' && G) render(); }, 120); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && layer.innerHTML) closeModal(); });

  try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* ignora */ }
  window.__amelie = { get G() { return G; }, profile, go, H, render, tileSVG };
  applySettings(); startStars(); render();
})();
</script>
</body>
</html>
